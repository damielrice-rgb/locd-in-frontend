    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: the title and description are what Google shows in search results.
         We put "St. Louis" + the services people actually search for in them. -->
    <title>Loc Stylist in St. Louis | Retwists, Starter Locs &amp; Loc Repair | Loc'd In</title>
    <meta
      name="description"
      content="Loc'd In by Morneice is a St. Louis loc stylist for retwists, starter locs, loc repair, kids' locs, and barrel twists. Book online in under a minute."
    />

    <!-- Google Fonts: Unbounded (headlines), Manrope (body), Allura (signature).
         preconnect = start connecting to Google early so fonts load faster. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;700;800&family=Allura&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
